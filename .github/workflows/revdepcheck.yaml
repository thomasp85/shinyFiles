on:
  workflow_dispatch:

name: revdepcheck

jobs:
  revdepcheck:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: r-lib/revdepcheck
          needs: check

      - name: Run revdepcheck
        run: |
          revdepcheck::revdep_check(num_workers = 4, quiet = FALSE)
        shell: Rscript {0}

      - name: Show revdep report
        if: always()
        run: |
          cat revdep/README.md || true
          cat revdep/problems.md || true
        shell: bash

      - name: Upload revdep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revdep-results
          path: revdep/
