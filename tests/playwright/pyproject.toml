[project]
name = "shinyfiles-browser-tests"
version = "0.1.0"
description = "Browser tests for the shinyFiles dialogs (Chromium, Firefox, WebKit) and JS coverage"
requires-python = ">=3.10"
dependencies = []

# Exact pins stand in for a lockfile: uv.lock records the index each package
# came from, so it is kept out of the repo and every machine resolves these
# same versions from whatever index it is configured to use.
[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
    "playwright==1.65.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
